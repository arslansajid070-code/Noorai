
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOOR AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:#fff;
 font-family:Arial,sans-serif;
}
header{
 padding:20px;text-align:center;
 background:#151d32;border-bottom:1px solid #29344c;
}
.logo{font-size:30px;font-weight:bold;color:#a78bfa}
header p{color:#aab4ca;margin:8px}
main{max-width:750px;margin:30px auto;padding:15px}
.welcome{text-align:center;margin:45px 0}
.welcome h1{font-size:34px}
.welcome p{color:#aab4ca}
#chat{
 min-height:250px;padding:15px;
}
.msg{
 padding:13px 16px;margin:12px 0;
 border-radius:15px;line-height:1.6;
 max-width:90%;white-space:pre-wrap;
}
.user{background:#493b85;margin-left:auto}
.ai{background:#19243a;margin-right:auto}
form{
 display:flex;gap:8px;margin-top:20px;
}
input{
 flex:1;min-width:0;padding:15px;
 border-radius:12px;border:1px solid #45516d;
 background:#151d32;color:white;font-size:16px;
}
button{
 padding:14px 20px;border:0;border-radius:12px;
 background:#8b5cf6;color:white;font-weight:bold;
}
button:disabled{opacity:.5}
footer{text-align:center;color:#8490a8;margin-top:25px;font-size:13px}
</style>
</head>
<body>
<header>
 <div class="logo">✦ NOOR AI</div>
 <p>Your Multilingual AI Assistant</p>
</header>
<main>
 <section class="welcome">
  <h1>Welcome to NOOR AI</h1>
  <p>Ask anything. Learn everything.</p>
  <p>Urdu • English • Arabic • Hindi • More</p>
 </section>
 <div id="chat" aria-live="polite"></div>
 <form id="chatForm">
  <input id="question" placeholder="Ask NOOR anything..." required>
  <button id="send" type="submit">Send</button>
 </form>
 <footer>NOOR AI — Built for everyone 🌍</footer>
</main>
<script>
const form=document.getElementById("chatForm");
const input=document.getElementById("question");
const chat=document.getElementById("chat");
const send=document.getElementById("send");

function message(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
}

form.addEventListener("submit",async(e)=>{
 e.preventDefault();
 const question=input.value.trim();
 if(!question)return;
 message(question,"user");
 input.value="";
 send.disabled=true;
 message("NOOR AI ka brain abhi connect hona baqi hai. Jald hi jawab dena shuru karega!","ai");
 send.disabled=false;
});
</script>
</body>
</html>
